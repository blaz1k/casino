<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoWin - Рулетка</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Pixelify Sans", serif;
            background-color: #1a2b3c;
            color: white;
            min-height: 100vh;
            image-rendering: pixelated;
        }
        
        /* Шапка */
        header {
            background-color: #8b278b;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #000000;
            letter-spacing: 1px;
        }
        
        .header-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .balance {
            font-size: 1.5rem;
            background-color: #641260;
            padding: 10px 20px;
            border-radius: 5px;
            border: 3px solid #9c399c;
        }
        
        .btn {
            font-family: "Pixelify Sans", serif;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 3px 3px 0 #000;
        }
        
        .btn-deposit {
            background-color: #4CAF50;
            color: white;
        }
        
        .btn-withdraw {
            background-color: #f44336;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 5px 5px 0 #000;
        }
        
        .btn:active {
            transform: translateY(1px);
            box-shadow: 2px 2px 0 #000;
        }
        
        /* Основное содержимое */
        .main-content {
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            color: #f8d347;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
        }
        
        .game-description {
            background-color: #2a3b4c;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border: 4px solid #3a4b5c;
            text-align: center;
        }
        
        .game-description p {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        
        /* Рулетка */
        .roulette-container {
            background-color: #2a3b4c;
            border-radius: 10px;
            padding: 30px;
            border: 4px solid #3a4b5c;
        }
        
        #roulette-wheel {
            width: 300px;
            height: 300px;
            border: 5px solid #fff;
            border-radius: 50%;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        #roulette-wheel:after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            margin-left: -15px;
            border-width: 30px 15px;
            border-style: solid;
            border-color: #f8d347 transparent transparent transparent;
            z-index: 10;
        }
        
        .segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            text-align: center;
            line-height: 150px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            border: 2px solid #000;
        }
        
        .red { 
            background-color: #e74c3c;
            border-color: #c0392b;
        }
        
        .black { 
            background-color: #34495e;
            border-color: #2c3e50;
        }
        
        /* Форма ставок */
        .bet-controls {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .bet-amount {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .bet-amount input {
            font-family: "Pixelify Sans", serif;
            font-size: 1.2rem;
            padding: 10px;
            width: 100px;
            text-align: center;
            border: 3px solid #4a5b6c;
            border-radius: 5px;
            background-color: #3a4b5c;
            color: white;
        }
        
        .color-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .btn-red {
            background-color: #e74c3c;
            color: white;
            font-size: 1.5rem;
            padding: 15px 30px;
        }
        
        .btn-black {
            background-color: #34495e;
            color: white;
            font-size: 1.5rem;
            padding: 15px 30px;
        }
        
        .btn-spin {
            background-color: #f8d347;
            color: #1a2b3c;
            font-size: 1.8rem;
            padding: 15px 50px;
            margin-top: 20px;
        }
        
        .win-message {
            font-size: 2rem;
            color: #f8d347;
            text-align: center;
            margin: 20px 0;
            min-height: 60px;
            text-shadow: 2px 2px 0 #000;
        }
        
        /* Кликер для пополнения */
        #clicker-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            text-align: center;
            padding-top: 15vh;
        }
        
        .clicker-content {
            background-color: #2a3b4c;
            border: 4px solid #f8d347;
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        #clicker-button {
            background-color: #f8d347;
            color: #1a2b3c;
            font-size: 2rem;
            padding: 20px 60px;
            margin: 20px 0;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 5px 5px 0 #000;
            transition: all 0.1s;
        }
        
        #clicker-button:active {
            transform: translateY(5px);
            box-shadow: 2px 2px 0 #000;
        }
        
        #clicks-count {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #f8d347;
        }
    </style>
</head>
<body>
    <!-- Шапка сайта -->
    <header>
        <div class="logo">AlgoWin</div>
        <div class="header-controls">
            <div class="balance">Баланс: <span id="balance-amount">1000</span> ₽</div>
            <button class="btn btn-deposit" id="deposit-btn">Пополнить</button>
            <button class="btn btn-withdraw" id="withdraw-btn">Вывести</button>
        </div>
    </header>
    
    <!-- Основное содержимое -->
    <div class="main-content">
        <h1>РУЛЕТКА</h1>
        
        <div class="game-description">
            <p>Выберите цвет и сделайте ставку!</p>
            <p>Красное дает 2x, Черное дает 2x</p>
        </div>
        
        <div class="roulette-container">
            <div id="roulette-wheel">
                <div class="segment red" style="transform: rotate(0deg);">КРАС</div>
                <div class="segment black" style="transform: rotate(18deg);">ЧЕР</div>
                <div class="segment red" style="transform: rotate(36deg);">КРАС</div>
                <div class="segment black" style="transform: rotate(54deg);">ЧЕР</div>
                <div class="segment red" style="transform: rotate(72deg);">КРАС</div>
                <div class="segment black" style="transform: rotate(90deg);">ЧЕР</div>
                <div class="segment red" style="transform: rotate(108deg);">КРАС</div>
                <div class="segment black" style="transform: rotate(126deg);">ЧЕР</div>
                <div class="segment red" style="transform: rotate(144deg);">КРАС</div>
                <div class="segment black" style="transform: rotate(162deg);">ЧЕР</div>
                <div class="segment red" style="transform: rotate(180deg);">КРАС</div>
                <div class="segment black" style="transform: rotate(198deg);">ЧЕР</div>
                <div class="segment red" style="transform: rotate(216deg);">КРАС</div>
                <div class="segment black" style="transform: rotate(234deg);">ЧЕР</div>
                <div class="segment red" style="transform: rotate(252deg);">КРАС</div>
                <div class="segment black" style="transform: rotate(270deg);">ЧЕР</div>
                <div class="segment red" style="transform: rotate(288deg);">КРАС</div>
                <div class="segment black" style="transform: rotate(306deg);">ЧЕР</div>
                <div class="segment red" style="transform: rotate(324deg);">КРАС</div>
                <div class="segment black" style="transform: rotate(342deg);">ЧЕР</div>
            </div>
            
            <div class="win-message" id="win-message"></div>
            
            <div class="bet-controls">
                <div class="bet-amount">
                    <span>Ставка:</span>
                    <input type="number" id="bet-amount" value="10" min="10" max="1000">
                    <span>₽</span>
                </div>
                
                <div class="color-buttons">
                    <button class="btn btn-red" id="btn-red">КРАСНОЕ</button>
                    <button class="btn btn-black" id="btn-black">ЧЕРНОЕ</button>
                </div>
                
                <button class="btn btn-spin" id="spin-button">КРУТИТЬ!</button>
            </div>
        </div>
    </div>

    <!-- Пополнение баланса (кликер) -->
    <div id="clicker-container">
        <div class="clicker-content">
            <h2>ПОПОЛНЕНИЕ БАЛАНСА</h2>
            <p id="clicks-count">КЛИКОВ: <span id="clicks-count-value">0</span></p>
            <p>1 клик = 10 ₽</p>
            <button id="clicker-button">КЛИКАЙ!</button>
            <button class="btn btn-spin" id="back-to-game">ЗАБРАТЬ ДЕНЬГИ</button>
        </div>
    </div>

    <script>
        // Игровые переменные
        let balance = 1000;
        let selectedColor = null;
        let clicks = 0;
        
        // Элементы интерфейса
        const balanceEl = document.getElementById('balance-amount');
        const betAmountEl = document.getElementById('bet-amount');
        const spinBtn = document.getElementById('spin-button');
        const btnRed = document.getElementById('btn-red');
        const btnBlack = document.getElementById('btn-black');
        const depositBtn = document.getElementById('deposit-btn');
        const withdrawBtn = document.getElementById('withdraw-btn');
        const winMessageEl = document.getElementById('win-message');
        const clickerContainer = document.getElementById('clicker-container');
        const clickerBtn = document.getElementById('clicker-button');
        const clicksCountEl = document.getElementById('clicks-count-value');
        const backToGameBtn = document.getElementById('back-to-game');
        const rouletteWheel = document.getElementById('roulette-wheel');
        
        // Обновление интерфейса
        function updateUI() {
            balanceEl.textContent = balance;
            spinBtn.disabled = balance < parseInt(betAmountEl.value) || balance <= 0;
        }
        
        // Выбор цвета
        btnRed.addEventListener('click', function() {
            selectedColor = 'red';
            btnRed.style.boxShadow = '0 0 15px #e74c3c';
            btnBlack.style.boxShadow = '3px 3px 0 #000';
        });
        
        btnBlack.addEventListener('click', function() {
            selectedColor = 'black';
            btnBlack.style.boxShadow = '0 0 15px #34495e';
            btnRed.style.boxShadow = '3px 3px 0 #000';
        });
        
        // Вращение рулетки
        spinBtn.addEventListener('click', function() {
            if (!selectedColor) {
                winMessageEl.textContent = 'ВЫБЕРИТЕ ЦВЕТ!';
                return;
            }
            
            const betAmount = parseInt(betAmountEl.value);
            if (!betAmount || betAmount < 10 || betAmount > balance) {
                winMessageEl.textContent = 'НЕВЕРНАЯ СТАВКА!';
                return;
            }
            
            // Блокируем кнопки во время вращения
            spinBtn.disabled = true;
            btnRed.disabled = true;
            btnBlack.disabled = true;
            
            // Запускаем вращение
            spinRoulette();
            
            // Определяем результат через 5 секунд
            setTimeout(() => {
                const winningColor = Math.random() < 0.5 ? 'red' : 'black';
                
                // Анимация выигрыша
                if (winningColor === selectedColor) {
                    const winAmount = betAmount * 2;
                    balance += winAmount;
                    winMessageEl.textContent = `ВЫ ВЫИГРАЛИ ${winAmount} ₽!`;
                    winMessageEl.style.color = '#4CAF50';
                } else {
                    balance -= betAmount;
                    winMessageEl.textContent = 'ВЫ ПРОИГРАЛИ!';
                    winMessageEl.style.color = '#f44336';
                }
                
                // Обновляем баланс
                updateUI();
                
                // Разблокируем кнопки
                spinBtn.disabled = balance < betAmount;
                btnRed.disabled = false;
                btnBlack.disabled = false;
                
                // Сбрасываем вращение через 3 секунды
                setTimeout(() => {
                    rouletteWheel.style.transition = 'none';
                    rouletteWheel.style.transform = 'rotate(0deg)';
                    setTimeout(() => {
                        rouletteWheel.style.transition = 'transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
                    }, 50);
                    
                    winMessageEl.textContent = '';
                }, 3000);
            }, 5000);
        });
        
        function spinRoulette() {
            const randomRotation = Math.floor(Math.random() * 360) + 3600;
            rouletteWheel.style.transform = `rotate(${randomRotation}deg)`;
        }
        
        // Пополнение баланса
        depositBtn.addEventListener('click', function() {
            clickerContainer.style.display = 'block';
            clicks = 0;
            clicksCountEl.textContent = clicks;
        });
        
        clickerBtn.addEventListener('click', function() {
            clicks++;
            clicksCountEl.textContent = clicks;
        });
        
        backToGameBtn.addEventListener('click', function() {
            const earned = clicks * 10;
            balance += earned;
            updateUI();
            clickerContainer.style.display = 'none';
            
            if (earned > 0) {
                winMessageEl.textContent = `+${earned} ₽!`;
                winMessageEl.style.color = '#4CAF50';
                setTimeout(() => {
                    winMessageEl.textContent = '';
                }, 2000);
            }
        });
        
        // Вывод средств
        withdrawBtn.addEventListener('click', function() {
            if (balance < 100) {
                winMessageEl.textContent = 'МИНИМУМ 100 ₽!';
                winMessageEl.style.color = '#f44336';
                setTimeout(() => {
                    winMessageEl.textContent = '';
                }, 2000);
                return;
            }
            
            const amount = parseInt(prompt(`Введите сумму вывода (до ${balance} ₽):`, balance.toString()));
            if (amount >= 100 && amount <= balance) {
                balance -= amount;
                updateUI();
                winMessageEl.textContent = `ЗАЯВКА НА ${amount} ₽ ОТПРАВЛЕНА!`;
                winMessageEl.style.color = '#f8d347';
                setTimeout(() => {
                    winMessageEl.textContent = '';
                }, 3000);
            } else if (amount !== null) {
                winMessageEl.textContent = 'НЕВЕРНАЯ СУММА!';
                winMessageEl.style.color = '#f44336';
                setTimeout(() => {
                    winMessageEl.textContent = '';
                }, 2000);
            }
        });
        
        // Инициализация игры
        updateUI();
    </script>
</body>
</html>
